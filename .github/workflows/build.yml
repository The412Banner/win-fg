name: build
on: [push, workflow_dispatch]
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so `git describe` can stamp the build
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y glslang-tools python3 cmake ninja-build
      - name: compile shaders + embed
        run: |
          sh tools/build_shaders.sh
          python3 tools/embed_spv.py
      - name: vulkan headers (Apache-2.0)
        run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers vk-headers
      - name: setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
      - name: cmake build
        run: |
          DESC="$(git describe --tags --always --dirty --long)"
          echo "win-fg build stamp: $DESC"
          cmake -B out -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWINFG_GIT_DESCRIBE="$DESC" \
            -DVULKAN_INCLUDE=$GITHUB_WORKSPACE/vk-headers/include
          cmake --build out
      - name: package
        run: |
          mkdir -p dist
          cp out/libwin_fg.so dist/
          cp manifest/VkLayer_win_framegen.json dist/
          echo "verify embedded build stamp:"
          strings dist/libwin_fg.so | grep 'win-fg-build' \
            || { echo "::error::git-describe version stamp missing from libwin_fg.so"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: win-fg-arm64
          path: dist/
